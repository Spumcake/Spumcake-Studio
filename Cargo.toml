[workspace]
resolver = "3"
members = [
    "host",
    "protocol",
    "assistant",
    "draw",
    "media",
    "layers",
    "client",
    "apps/template",
    "apps/storyboard-generator",
    "apps/recipe-creation",
    "apps/image-generator",
    "apps/video-generator",
    "apps/3d-viewport",
]

# octotablet 0.1.0 binds tablet protocol versions it cannot parse, which
# closes the window's Wayland connection. See host/vendor/octotablet/PATCHED.md.
[patch.crates-io]
octotablet = { path = "host/vendor/octotablet" }

# Images are composited and painted pixel by pixel, which an unoptimised
# build does twenty times slower: everyday builds are optimised, and keep
# their debug checks.
[profile.dev]
opt-level = 2
# Line numbers in crash reports, without full debug info, which made each
# program about 600 MB (the owner, 2026-11-16).
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
