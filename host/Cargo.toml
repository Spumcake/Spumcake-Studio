[package]
name = "inpainter"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
assistant = { path = "../assistant" }
directories = "=6.0.0"
draw = { path = "../draw" }
eframe = "=0.36.2"
iconflow = { version = "=2.1.0", default-features = false, features = ["pack-iconoir"] }
# The decoder eframe's `icon_data` reads images with, given JPEG beside PNG,
# so research sources in `sources/` show, as the owner set on 2026-11-20.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
kurbo = "=0.13.1"
libc = "=0.2.190"
octotablet = { version = "=0.1.0", default-features = false, features = ["wayland-tablet-unstable-v2"] }
protocol = { path = "../protocol" }
# Spumcake-Render's engine, which also brings its scene reader, at the commit
# the Studio session manager set on 2026-11-16.
spumcake-render = { git = "https://github.com/Spumcake/Spumcake-Render", rev = "7ed9095c6785ea9ba1c97766347aa06529f6dc06" }
keyring = "=4.2.0"
rfd = "=0.15.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
trash = "=5.2.9"
