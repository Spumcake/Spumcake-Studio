[package]
name = "image-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
protocol = { path = "../../protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
# PNG and JPEG in and out, and WebP in, as the owner approved on
# 2026-11-16 for takes and references. Already in the lockfile through
# eframe; WebP adds image-webp.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Text layers' glyphs, from the fonts in assets/fonts/, as the owner
# approved on 2026-10-31. Already in the lockfile through egui.
ab_glyph = "=0.2.32"
# What it shares with the Video Generator: linked files, notes, the pre-vis
# check's edges, and round layouts, as Studio 0.15's plan approved.
layers = { path = "../../layers" }
