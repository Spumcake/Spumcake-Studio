[package]
name = "video-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# The transport row: `RasterView.transport`, `transport_time`, and
# `Cue.colour`, which come to dev with the 3D Viewport's merge. On after it.
transport = []

[dependencies]
protocol = { path = "../../protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
# Decoding video and sound, shared with the other workspaces that play them.
media = { path = "../../media" }
# PNG in and out, for thumbnails and frames written for the host.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# What it shares with the Image Generator: linked files, notes, the pre-vis
# check's edges, and round layouts, as Studio 0.15's plan approved.
layers = { path = "../../layers" }
